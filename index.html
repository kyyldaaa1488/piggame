<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Pig Simulator Mobile 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #87CEEB;
            touch-action: none;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Главное меню */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
            padding: 15px;
            overflow-y: auto;
        }

        #main-menu h1 {
            font-size: 26px;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }

        .menu-section {
            width: 100%;
            max-width: 600px;
            margin-bottom: 15px;
        }

        .menu-section h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #ff7e00;
            text-align: center;
        }

        .options-grid {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .select-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 10px 15px;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            width: 110px;
        }

        .select-btn.active {
            border-color: #ff758c;
            background: rgba(255, 117, 140, 0.4);
        }

        .char-icon {
            font-size: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .char-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #start-btn {
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            border: none;
            padding: 12px 35px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            margin-top: 10px;
        }

        #start-btn:active {
            transform: scale(0.95);
        }

        /* HUD Overlay — перенесен в самый верх экрана */
        #ui-container {
            position: absolute;
            top: 6px;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            z-index: 5;
        }

        .hud-top {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .hud-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 5px 10px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: bold;
            color: #333;
            font-size: 12px;
            border: 1.5px solid #fff;
        }

        /* Компактная кнопка меню в самом верху */
        #btn-back-menu {
            pointer-events: auto;
            background: rgba(255, 255, 255, 0.85);
            border: 1.5px solid #fff;
            border-radius: 12px;
            padding: 5px 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            line-height: 1;
        }

        #btn-back-menu:active {
            transform: scale(0.92);
        }

        .bar-container {
            width: 70px;
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .bar-fill {
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            border-radius: 5px;
            transition: width 0.2s ease;
        }

        #touch-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto;
            z-index: 2;
        }

        #joystick-zone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            backdrop-filter: blur(4px);
            touch-action: none;
        }

        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .action-buttons {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            gap: 12px;
            flex-direction: column-reverse;
            align-items: flex-end;
            pointer-events: auto;
        }

        .btn-action {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.85);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            backdrop-filter: blur(4px);
            touch-action: none;
        }

        .btn-action:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 1);
        }

        #camera-touch-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 60%;
            height: 100%;
            touch-action: none;
        }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Главное меню -->
    <div id="main-menu">
        <h1>Свинья Симулятор 3D</h1>

        <div class="menu-section">
            <h2>Выбор Карты</h2>
            <div class="options-grid">
                <div class="select-btn active" id="map-standard" onclick="chooseMap('standard')">
                    <div class="char-icon">🌳</div>
                    <span>Стандарт</span>
                </div>
                <div class="select-btn" id="map-school" onclick="chooseMap('school')">
                    <div class="char-icon">🏫</div>
                    <span>102 Лицей</span>
                </div>
            </div>
        </div>

        <div class="menu-section">
            <h2>Выбор Персонажа</h2>
            <div class="options-grid">
                <div class="select-btn active" id="char-standard" onclick="chooseChar('standard')">
                    <div class="char-icon">🐷</div>
                    <span>Свинья</span>
                </div>
                <div class="select-btn" id="char-masha" onclick="chooseChar('masha')">
                    <div class="char-icon"><img src="qpig1.png" alt="" onerror="this.src=''; this.parentElement.innerText='👧';"></div>
                    <span>Мэджик</span>
                </div>
                <div class="select-btn" id="char-suzy" onclick="chooseChar('suzy')">
                    <div class="char-icon"><img src="qpig2.png" alt="" onerror="this.src=''; this.parentElement.innerText='🎀';"></div>
                    <span>Сюзи</span>
                </div>
                <div class="select-btn" id="char-putin" onclick="chooseChar('putin')">
                    <div class="char-icon"><img src="qpig3.png" alt="" onerror="this.src=''; this.parentElement.innerText='👑';"></div>
                    <span>putintop</span>
                </div>
                <div class="select-btn" id="char-pig4" onclick="chooseChar('pig4')">
                    <div class="char-icon"><img src="qpig4.png" alt="" onerror="this.src=''; this.parentElement.innerText='❓';"></div>
                    <span>???</span>
                </div>
                <div class="select-btn" id="char-pig5" onclick="chooseChar('pig5')">
                    <div class="char-icon"><img src="qpig5.png" alt="" onerror="this.src=''; this.parentElement.innerText='🌀';"></div>
                    <span>////</span>
                </div>
            </div>
        </div>

        <button id="start-btn" onclick="startGame()">ИГРАТЬ</button>
    </div>

    <!-- Игровой интерфейс -->
    <div id="touch-layer">
        <div id="camera-touch-zone"></div>
        <div id="joystick-zone">
            <div id="joystick-knob"></div>
        </div>
        <div class="action-buttons">
            <div id="btn-jump" class="btn-action">🦘</div>
            <div id="btn-mud" class="btn-action">💩</div>
            <div id="btn-oink" class="btn-action">🐷</div>
        </div>
    </div>

    <div id="ui-container">
        <div class="hud-top">
            <div class="hud-card">
                <span>🐷 Счастье</span>
                <div class="bar-container">
                    <div id="happiness-bar" class="bar-fill"></div>
                </div>
            </div>
            <div class="hud-card">
                <span id="collectible-label">🍎 <span id="apple-count">0</span></span>
            </div>
        </div>
        <!-- Компактная кнопка меню -->
        <button id="btn-back-menu" onclick="openMenu()">⚙️</button>
    </div>

    <script>
        // --- ЧЕРЕДОВАНИЕ ЗВУКОВ ---
        const mudSounds = [
            new Audio('sound1.mp3'),
            new Audio('sound3.mp3'),
            new Audio('sound5.mp3')
        ];
        const oinkSounds = [
            new Audio('sound2.mp3'),
            new Audio('sound4.mp3'),
            new Audio('sound6.mp3')
        ];

        let mudSoundIdx = 0;
        let oinkSoundIdx = 0;

        function playNextMudSound() {
            const snd = mudSounds[mudSoundIdx];
            snd.currentTime = 0;
            snd.play().catch(e => {});
            mudSoundIdx = (mudSoundIdx + 1) % mudSounds.length;
        }

        function playNextOinkSound() {
            const snd = oinkSounds[oinkSoundIdx];
            snd.currentTime = 0;
            snd.play().catch(e => {});
            oinkSoundIdx = (oinkSoundIdx + 1) % oinkSounds.length;
        }

        // --- ВЫБОР В МЕНЮ ---
        let selectedMap = 'standard';
        let selectedChar = 'standard';

        function chooseMap(mapType) {
            selectedMap = mapType;
            document.querySelectorAll('.menu-section')[0].querySelectorAll('.select-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`map-${mapType}`).classList.add('active');
        }

        function chooseChar(charType) {
            selectedChar = charType;
            document.querySelectorAll('.menu-section')[1].querySelectorAll('.select-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`char-${charType}`).classList.add('active');
        }

        function openMenu() {
            gameStarted = false;
            document.getElementById('main-menu').style.display = 'flex';
        }

        // --- ИНИЦИАЛИЗА СЦЕНЫ И РЕНДЕРЕРА ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- ОСВЕЩЕНИЕ ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.85);
        dirLight.position.set(40, 60, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- МАТЕРИАЛЫ ---
        const pinkMat = new THREE.MeshToonMaterial({ color: 0xffa6c9 });
        const darkPinkMat = new THREE.MeshToonMaterial({ color: 0xf080a8 });
        const blackMat = new THREE.MeshToonMaterial({ color: 0x222222 });
        const mudPigMat = new THREE.MeshToonMaterial({ color: 0x7a5230 });
        const poopMat = new THREE.MeshToonMaterial({ color: 0x5c3a21 });
        const grassMat = new THREE.MeshToonMaterial({ color: 0x7ec850 });
        const mudMat = new THREE.MeshToonMaterial({ color: 0x5a3d28 });
        const woodMat = new THREE.MeshToonMaterial({ color: 0x8b5a2b });
        const leafMat = new THREE.MeshToonMaterial({ color: 0x4caf50 });
        const hayMat = new THREE.MeshToonMaterial({ color: 0xe6c229 });
        const appleMat = new THREE.MeshToonMaterial({ color: 0xff3333 });
        const fenceMat = new THREE.MeshToonMaterial({ color: 0x5c3a21 });
        const plateMat = new THREE.MeshToonMaterial({ color: 0xdddddd });

        // --- ГЕЙМПЛЕЙНЫЕ ПЕРЕМЕННЫЕ ---
        let happiness = 50;
        let applesCollected = 0;
        let isMuddy = false;
        let mudTimer = 0;
        let poopCooldown = 0;
        let gameStarted = false;

        // --- СОЗДАНИЕ ПЕРСОНАЖА (СВИНЬЯ) ---
        const pigGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(1.2, 1.0, 1.6);
        const body = new THREE.Mesh(bodyGeo, pinkMat);
        body.position.y = 0.8;
        body.castShadow = true;
        body.receiveShadow = true;
        pigGroup.add(body);

        const headGeo = new THREE.BoxGeometry(0.9, 0.8, 0.8);
        const head = new THREE.Mesh(headGeo, pinkMat);
        head.position.set(0, 1.0, 0.9);
        head.castShadow = true;
        pigGroup.add(head);

        const snoutGeo = new THREE.BoxGeometry(0.4, 0.3, 0.2);
        const snout = new THREE.Mesh(snoutGeo, darkPinkMat);
        snout.position.set(0, 0.9, 1.4);
        pigGroup.add(snout);

        const eyeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const eyeL = new THREE.Mesh(eyeGeo, blackMat);
        eyeL.position.set(0.28, 1.1, 1.31);
        const eyeR = eyeL.clone();
        eyeR.position.x = -0.28;
        pigGroup.add(eyeL);
        pigGroup.add(eyeR);

        const earGeo = new THREE.BoxGeometry(0.2, 0.3, 0.1);
        const earL = new THREE.Mesh(earGeo, darkPinkMat);
        earL.position.set(0.4, 1.4, 0.9);
        earL.rotation.z = -0.3;
        const earR = earL.clone();
        earR.position.x = -0.4;
        earR.rotation.z = 0.3;
        pigGroup.add(earL);
        pigGroup.add(earR);

        const tailGeo = new THREE.BoxGeometry(0.1, 0.1, 0.3);
        const tail = new THREE.Mesh(tailGeo, darkPinkMat);
        tail.position.set(0, 1.0, -0.9);
        tail.rotation.x = 0.4;
        pigGroup.add(tail);

        const legGeo = new THREE.BoxGeometry(0.3, 0.5, 0.3);
        const legs = [];
        const legPositions = [
            [-0.4, 0.25, 0.5],
            [0.4, 0.25, 0.5],
            [-0.4, 0.25, -0.5],
            [0.4, 0.25, -0.5]
        ];

        legPositions.forEach(pos => {
            const leg = new THREE.Mesh(legGeo, darkPinkMat);
            leg.position.set(...pos);
            leg.castShadow = true;
            pigGroup.add(leg);
            legs.push(leg);
        });

        scene.add(pigGroup);

        function setPigMaterial(material) {
            body.material = material;
            if (!head.material.map) {
                head.material = material;
            }
        }

        // --- ЗАГРУЗКА ТЕКСТУР И СТАРТ ИГРЫ ---
        const textureLoader = new THREE.TextureLoader();

        function clearWorld() {
            const toRemove = [];
            scene.children.forEach(c => {
                if (c !== pigGroup && c !== ambientLight && c !== dirLight) {
                    toRemove.push(c);
                }
            });
            toRemove.forEach(c => scene.remove(c));

            mudPools.length = 0;
            collectibles.length = 0;
            destructibles.length = 0;
            particles.length = 0;
        }

        function startGame() {
            clearWorld();

            const charTextures = {
                'masha': 'qpig1.png',
                'suzy': 'qpig2.png',
                'putin': 'qpig3.png',
                'pig4': 'qpig4.png',
                'pig5': 'qpig5.png'
            };

            if (selectedChar !== 'standard' && charTextures[selectedChar]) {
                textureLoader.load(charTextures[selectedChar], (texture) => {
                    head.material = new THREE.MeshToonMaterial({ map: texture });
                    snout.visible = false;
                });
            } else {
                head.material = pinkMat;
                snout.visible = true;
            }

            pigGroup.position.set(0, 0, 0);
            applesCollected = 0;
            happiness = 50;

            buildWorld(selectedMap);

            document.getElementById('main-menu').style.display = 'none';
            gameStarted = true;
        }

        // --- ПОСТРОЕНИЕ КАРТЫ ---
        const mudPools = [];
        const collectibles = [];
        const destructibles = [];

        function createMudPool(x, z, radius) {
            const mudGeo = new THREE.CircleGeometry(radius, 16);
            const mudPool = new THREE.Mesh(mudGeo, mudMat);
            mudPool.rotation.x = -Math.PI / 2;
            mudPool.position.set(x, 0.05, z);
            mudPool.receiveShadow = true;
            scene.add(mudPool);
            mudPools.push({ position: new THREE.Vector3(x, 0, z), radius: radius });
        }

        function spawnPoop(x, z) {
            const poopGroup = new THREE.Group();
            const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 0.3, 8), poopMat);
            b1.position.y = 0.15;
            b1.castShadow = true;
            poopGroup.add(b1);

            const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 0.25, 8), poopMat);
            b2.position.y = 0.35;
            b2.castShadow = true;
            poopGroup.add(b2);

            const b3 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.25, 8), poopMat);
            b3.position.y = 0.55;
            b3.castShadow = true;
            poopGroup.add(b3);

            poopGroup.position.set(x, 0, z);
            scene.add(poopGroup);
            createParticles(poopGroup.position, 0x5c3a21);
        }

        function spawnApple(x, z) {
            const appleGroup = new THREE.Group();
            const aMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), appleMat);
            aMesh.position.y = 0.3;
            aMesh.castShadow = true;
            appleGroup.add(aMesh);

            const stem = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.05), woodMat);
            stem.position.y = 0.55;
            appleGroup.add(stem);

            appleGroup.position.set(x, 0, z);
            scene.add(appleGroup);
            collectibles.push({ mesh: appleGroup, type: 'apple' });
        }

        function spawnPoopPlate(x, z) {
            const plateGroup = new THREE.Group();
            
            const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.4, 0.1, 16), plateMat);
            plate.position.y = 0.05;
            plate.receiveShadow = true;
            plateGroup.add(plate);

            const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.45, 0.2, 8), poopMat);
            p1.position.y = 0.15;
            p1.castShadow = true;
            plateGroup.add(p1);

            const p2 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.2, 8), poopMat);
            p2.position.y = 0.3;
            p2.castShadow = true;
            plateGroup.add(p2);

            plateGroup.position.set(x, 0, z);
            scene.add(plateGroup);
            collectibles.push({ mesh: plateGroup, type: 'plate' });
        }

        function spawnHayBale(x, z) {
            const hay = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 1.5, 12), hayMat);
            hay.rotation.z = Math.PI / 2;
            hay.position.set(x, 0.75, z);
            hay.castShadow = true;
            hay.receiveShadow = true;
            scene.add(hay);
            destructibles.push({ mesh: hay, type: 'hay', destroyed: false, velocity: new THREE.Vector3() });
        }

        function spawnTree(x, z) {
            const tree = new THREE.Group();
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3, 8), woodMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            tree.add(trunk);

            const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(2), leafMat);
            leaves.position.y = 3.5;
            leaves.castShadow = true;
            tree.add(leaves);

            tree.position.set(x, 0, z);
            scene.add(tree);
        }

        function buildWorld(type) {
            const floorGeo = new THREE.PlaneGeometry(120, 120, 32, 32);
            const floor = new THREE.Mesh(floorGeo, grassMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            createMudPool(10, -10, 6);
            createMudPool(-20, 15, 7);
            createMudPool(25, 20, 5);

            if (type === 'school') {
                document.getElementById('collectible-label').innerHTML = '💩 <span id="apple-count">0</span>';
                
                textureLoader.load('school.jpg', (texture) => {
                    const schoolGeo = new THREE.BoxGeometry(50, 18, 5);
                    const schoolMat = [
                        woodMat, woodMat, woodMat, woodMat,
                        new THREE.MeshBasicMaterial({ map: texture }),
                        woodMat
                    ];
                    const school = new THREE.Mesh(schoolGeo, schoolMat);
                    school.position.set(0, 9, -45);
                    school.castShadow = true;
                    school.receiveShadow = true;
                    scene.add(school);
                });

                const fenceRadius = 55;
                const count = 30;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.cos(angle) * fenceRadius;
                    const z = Math.sin(angle) * fenceRadius;

                    if (z < -40 && Math.abs(x) < 30) continue;

                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.5, 0.6), fenceMat);
                    post.position.set(x, 1.25, z);
                    post.castShadow = true;
                    scene.add(post);

                    const rail = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 0.2), fenceMat);
                    rail.position.set(x, 1.5, z);
                    rail.rotation.y = angle + Math.PI / 2;
                    rail.castShadow = true;
                    scene.add(rail);
                }

                for (let i = 0; i < 30; i++) {
                    spawnPoopPlate((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 70);
                }

            } else {
                document.getElementById('collectible-label').innerHTML = '🍎 <span id="apple-count">0</span>';

                const fenceRadius = 55;
                const count = 40;
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const x = Math.cos(angle) * fenceRadius;
                    const z = Math.sin(angle) * fenceRadius;

                    const post = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 0.4), woodMat);
                    post.position.set(x, 0.9, z);
                    post.castShadow = true;
                    scene.add(post);
                }

                for (let i = 0; i < 30; i++) {
                    spawnApple((Math.random() - 0.5) * 80, (Math.random() - 0.5) * 80);
                }
            }

            for (let i = 0; i < 20; i++) {
                const x = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 70;
                if (Math.hypot(x - 10, z + 10) > 8) spawnTree(x, z);
            }

            for (let i = 0; i < 12; i++) {
                spawnHayBale((Math.random() - 0.5) * 70, (Math.random() - 0.5) * 70);
            }
        }

        const particles = [];
        function createParticles(pos, colorHex) {
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const pGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos);
                p.position.y += 0.5;
                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.2,
                    Math.random() * 0.2 + 0.1,
                    (Math.random() - 0.5) * 0.2
                );
                scene.add(p);
                particles.push({ mesh: p, vel: vel, life: 30 });
            }
        }

        // --- МОБИЛЬНОЕ УПРАВЛЕНИЕ ---
        let joystickVector = { x: 0, y: 0 };
        let isMudButtonPressed = false;
        let isJumpRequested = false;

        const joystickZone = document.getElementById('joystick-zone');
        const joystickKnob = document.getElementById('joystick-knob');
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            updateJoystick(touch);
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joystickTouchId) {
                    updateJoystick(touch);
                }
            }
        }, { passive: false });

        const resetJoystick = () => {
            joystickTouchId = null;
            joystickVector = { x: 0, y: 0 };
            joystickKnob.style.transform = `translate(-50%, -50%)`;
        };

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    resetJoystick();
                }
            }
        });

        function updateJoystick(touch) {
            const maxRadius = 40;
            let dx = touch.clientX - joystickCenter.x;
            let dy = touch.clientY - joystickCenter.y;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joystickVector = {
                x: dx / maxRadius,
                y: dy / maxRadius
            };
        }

        const btnJump = document.getElementById('btn-jump');
        const btnMud = document.getElementById('btn-mud');
        const btnOink = document.getElementById('btn-oink');

        btnJump.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isJumpRequested = true;
        }, { passive: false });

        btnMud.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isMudButtonPressed = true;
            playNextMudSound();
        }, { passive: false });

        btnMud.addEventListener('touchend', (e) => {
            e.preventDefault();
            isMudButtonPressed = false;
        }, { passive: false });

        btnOink.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playNextOinkSound();
            happiness = Math.min(100, happiness + 2);
            earL.rotation.z = -0.6;
            earR.rotation.z = 0.6;
            setTimeout(() => {
                earL.rotation.z = -0.3;
                earR.rotation.z = 0.3;
            }, 200);
        }, { passive: false });

        // Поворот камеры
        let cameraTouchId = null;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let yaw = 0;
        let pitch = 0.3;
        const cameraDistance = 7;

        const cameraTouchZone = document.getElementById('camera-touch-zone');

        cameraTouchZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            cameraTouchId = touch.identifier;
            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === cameraTouchId) {
                    const dx = touch.clientX - lastTouchX;
                    const dy = touch.clientY - lastTouchY;

                    yaw -= dx * 0.005;
                    pitch -= dy * 0.005;
                    pitch = Math.max(0.1, Math.min(Math.PI / 2.5, pitch));

                    lastTouchX = touch.clientX;
                    lastTouchY = touch.clientY;
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === cameraTouchId) {
                    cameraTouchId = null;
                }
            }
        });

        // ФИЗИКА И ДВИЖЕНИЕ
        let velocityY = 0;
        let isGrounded = true;
        const gravity = -0.015;
        const pigSpeed = 0.15;

        // --- ГЛАВНЫЙ ИГРОВОЙ ЦИКЛ ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            if (!gameStarted) {
                renderer.render(scene, camera);
                return;
            }

            const elapsedTime = clock.getElapsedTime();

            // Движение
            const moveVector = new THREE.Vector3(joystickVector.x, 0, joystickVector.y);
            const isMoving = moveVector.lengthSq() > 0.05;

            if (isMoving) {
                moveVector.normalize();
                moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                pigGroup.position.addScaledVector(moveVector, pigSpeed);

                const targetAngle = Math.atan2(moveVector.x, moveVector.z);
                let diff = targetAngle - pigGroup.rotation.y;
                diff = Math.atan2(Math.sin(diff), Math.cos(diff));
                pigGroup.rotation.y += diff * 0.2;
            }

            // Прыжок
            if (isJumpRequested && isGrounded) {
                velocityY = 0.28;
                isGrounded = false;
                isJumpRequested = false;
            }

            // Гравитация
            pigGroup.position.y += velocityY;
            if (!isGrounded) {
                velocityY += gravity;
                if (pigGroup.position.y <= 0) {
                    pigGroup.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                }
            }

            // Границы карты
            const distFromCenter = Math.hypot(pigGroup.position.x, pigGroup.position.z);
            if (distFromCenter > 53) {
                pigGroup.position.setLength(53);
            }

            // Анимация
            if (isMoving && isGrounded) {
                legs[0].rotation.x = Math.sin(elapsedTime * 12) * 0.6;
                legs[1].rotation.x = -Math.sin(elapsedTime * 12) * 0.6;
                legs[2].rotation.x = -Math.sin(elapsedTime * 12) * 0.6;
                legs[3].rotation.x = Math.sin(elapsedTime * 12) * 0.6;
                pigGroup.position.y = Math.abs(Math.sin(elapsedTime * 12)) * 0.1;
            } else if (isGrounded) {
                legs.forEach(l => l.rotation.x = 0);
                pigGroup.position.y = 0;
                head.rotation.z = Math.sin(elapsedTime * 2) * 0.05;
                tail.rotation.y = Math.sin(elapsedTime * 8) * 0.3;
            }

            // Логика грязи
            let inAnyMud = false;
            mudPools.forEach(pool => {
                const distToMud = Math.hypot(pigGroup.position.x - pool.position.x, pigGroup.position.z - pool.position.z);
                if (distToMud < pool.radius) {
                    inAnyMud = true;
                }
            });

            if (isMudButtonPressed) {
                if (inAnyMud) {
                    isMuddy = true;
                    mudTimer = 600;
                    happiness = Math.min(100, happiness + 0.2);
                    pigGroup.rotation.z = Math.sin(elapsedTime * 10) * 0.3;
                } else {
                    pigGroup.rotation.z = 0;
                    if (poopCooldown <= 0) {
                        const backOffset = new THREE.Vector3(0, 0, -1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), pigGroup.rotation.y);
                        const poopX = pigGroup.position.x + backOffset.x;
                        const poopZ = pigGroup.position.z + backOffset.z;
                        spawnPoop(poopX, poopZ);

                        poopCooldown = 20;
                        happiness = Math.min(100, happiness + 5);
                    }
                }
            } else {
                pigGroup.rotation.z = 0;
            }

            if (poopCooldown > 0) poopCooldown--;

            if (isMuddy) {
                setPigMaterial(mudPigMat);
                mudTimer--;
                if (mudTimer <= 0) {
                    isMuddy = false;
                    setPigMaterial(pinkMat);
                }
            }

            // Сбор предметов
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const item = collectibles[i];
                item.mesh.rotation.y += 0.02;

                const dist = pigGroup.position.distanceTo(item.mesh.position);
                if (dist < 1.5) {
                    createParticles(item.mesh.position, item.type === 'apple' ? 0xff3333 : 0x5c3a21);
                    scene.remove(item.mesh);
                    collectibles.splice(i, 1);

                    applesCollected++;
                    happiness = Math.min(100, happiness + 15);

                    document.getElementById('apple-count').innerText = applesCollected;
                }
            }

            // Разрушение Стогов Сена
            destructibles.forEach(item => {
                if (item.destroyed) {
                    item.mesh.position.add(item.velocity);
                    item.mesh.scale.multiplyScalar(0.95);
                    item.velocity.y += gravity;
                    if (item.mesh.position.y < 0) item.mesh.position.y = 0;
                } else {
                    const dist = pigGroup.position.distanceTo(item.mesh.position);
                    if (dist < 1.8 && isMoving) {
                        item.destroyed = true;
                        createParticles(item.mesh.position, 0xe6c229);
                        happiness = Math.min(100, happiness + 10);

                        const pushDir = new THREE.Vector3()
                            .subVectors(item.mesh.position, pigGroup.position)
                            .normalize();
                        item.velocity.set(pushDir.x * 0.2, 0.15, pushDir.z * 0.2);
                    }
                }
            });

            // Частицы
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.vel);
                p.life--;
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }

            // Спад счастья
            happiness = Math.max(0, happiness - 0.02);
            document.getElementById('happiness-bar').style.width = `${happiness}%`;

            // Камера
            const cx = pigGroup.position.x + cameraDistance * Math.sin(yaw) * Math.cos(pitch);
            const cy = pigGroup.position.y + cameraDistance * Math.sin(pitch) + 1.0;
            const cz = pigGroup.position.z + cameraDistance * Math.cos(yaw) * Math.cos(pitch);

            camera.position.set(cx, cy, cz);
            camera.lookAt(pigGroup.position.x, pigGroup.position.y + 1.0, pigGroup.position.z);

            renderer.render(scene, camera);
        }

        // --- ПОДДЕРЖКА ОРИЕНТАЦИИ ЭКРАНА ---
        function updateScreenSize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        window.addEventListener('resize', updateScreenSize);
        window.addEventListener('orientationchange', () => {
            setTimeout(updateScreenSize, 200);
        });

        animate();
    </script>
</body>
</html>
